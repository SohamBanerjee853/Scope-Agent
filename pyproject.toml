[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "scope-agent"
version = "0.1.0"
description = "Local permission scopes and source-grounded understanding checks for coding agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["rich>=13.9,<15", "PyYAML>=6.0,<7"]

[project.scripts]
scope = "scope.cli:main"

[dependency-groups]
dev = ["pytest>=8.3,<10"]

[tool.hatch.build.targets.wheel]
packages = ["src/scope"]

[tool.hatch.build.targets.sdist]
include = ["src/scope", "tests", "docs", "pyproject.toml", "uv.lock", "README.md", "PLAIN.md", "AGENTS.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
