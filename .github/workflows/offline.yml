name: Offline package checks

on:
  push:
    branches: [main, integration/scope]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Python 3.11 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    env:
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      UV_PYTHON_DOWNLOADS: never
      UV_NO_PROGRESS: "1"
      UV_NO_EDITABLE: "1"
      SCOPE_HOME: ${{ github.workspace }}/.tools/ci-homes/scope
      CODEX_HOME: ${{ github.workspace }}/.tools/ci-homes/codex
      CLAUDE_CONFIG_DIR: ${{ github.workspace }}/.tools/ci-homes/claude
      SCOPE_POPUP: "0"
    steps:
      # Tag targets and action.yml were verified against the official repositories.
      - name: Check out the tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Set up uv 0.12.13
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.13"
          enable-cache: false

      - name: Install the locked package without editable sources
        run: uv sync --locked --no-editable --python 3.11

      - name: Verify installed package provenance and resources
        run: uv run --no-sync python -I scripts/check-package.py --resources-only

      - name: Run the full offline test suite
        run: uv run --no-sync python -m pytest -q -ra

      - name: Build the source distribution and wheel
        run: uv build --python 3.11

      - name: Exercise installed permission smoke for both dialects
        run: uv run --no-sync python -I scripts/check-package.py

      - name: Verify installed payment fixture and combined A2/A3 rehearsal
        run: uv run --no-sync python -I scripts/check-demo.py

      - name: Provide tmux for the fake-host terminal rehearsal
        if: runner.os == 'macOS'
        run: |
          command -v tmux >/dev/null || brew install tmux
          tmux -V

      - name: Exercise both fake hosts inside and outside tmux
        if: runner.os == 'macOS'
        run: uv run --no-sync python -I scripts/check-launcher.py

      - name: Check the POSIX smoke wrapper
        if: runner.os == 'macOS'
        run: sh scripts/smoke.sh --dry-run

      - name: Check the PowerShell smoke wrapper
        if: runner.os == 'Windows'
        run: ./scripts/smoke.ps1 --dry-run

      # These jobs do not install or start Codex/Claude, use credentials for model
      # work, or establish native hook trust. Native Windows manual-pane startup
      # and real-human acceptance remain separate from shared contract tests.
